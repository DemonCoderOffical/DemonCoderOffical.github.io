<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #cccccc;
            font-family: 'Consolas', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            border: 2px solid #00bcd4;
            padding: 30px;
            background-color: #1a1a1a;
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(0, 188, 212, 0.3);
            text-align: center;
        }
        h1 {
            color: #00bcd4;
            margin-top: 0;
        }
        p {
            color: #cccccc;
            margin-bottom: 25px;
        }
        .back-btn {
            display: inline-block;
            background-color: #00838f;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            font-family: 'Consolas', monospace;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }
        .back-btn:hover {
            background-color: #00bcd4;
            color: #0f0f0f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ Success! ]</h1>
        <p>Your bug report has been successfully sent. Thanks for helping improve our projects!</p>
        <a href="https://voidcoderstudio.github.io" class="back-btn">← want to download netplus?</a>
    </div>

</body>
</html>
