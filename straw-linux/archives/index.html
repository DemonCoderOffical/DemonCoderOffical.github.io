<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straw Linux - Package Archives</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #58a6ff;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 30px;
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            background-color: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 25px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus {
            border-color: #58a6ff;
        }
        .package-list {
            display: grid;
            gap: 15px;
        }
        .package-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            transition: border-color 0.2s;
        }
        .package-card:hover {
            border-color: #8b949e;
        }
        .pkg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .pkg-name {
            font-size: 18px;
            font-weight: bold;
            color: #58a6ff;
            text-decoration: none;
        }
        .pkg-name:hover {
            text-decoration: underline;
        }
        .pkg-version {
            background: #30363d;
            color: #c9d1d9;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .pkg-desc {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .pkg-command {
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            color: #7ee787;
            border: 1px solid #30363d;
            display: inline-block;
        }
        .no-results {
            text-align: center;
            color: #8b949e;
            padding: 40px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Package Archives</h1>
        <div class="subtitle">Official software repository for Straw Linux</div>

        <input type="text" id="searchInput" class="search-box" placeholder="Search packages (e.g. system, neofetch)..." onkeyup="filterPackages()">

        <div id="packageList" class="package-list">
            <!-- System Package Card -->
            <div class="package-card" data-name="system">
                <div class="pkg-header">
                    <a href="system/" class="pkg-name">system</a>
                    <span class="pkg-version">v1.0</span>
                </div>
                <div class="pkg-desc">Core system binaries, kernel components, and file system updates.</div>
                <div class="pkg-command">pkg update</div>
            </div>

            <!-- Neofetch Package Card -->
            <div class="package-card" data-name="neofetch">
                <div class="pkg-header">
                    <a href="neofetch/" class="pkg-name">neofetch</a>
                    <span class="pkg-version">v1.0</span>
                </div>
                <div class="pkg-desc">A command-line system information tool displaying hardware and OS specs.</div>
                <div class="pkg-command">pkg install neofetch</div>
            </div>
        </div>

        <div id="noResults" class="no-results">No packages found matching your search.</div>
    </div>

    <script>
        function filterPackages() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('package-card');
            let visibleCount = 0;

            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name').toLowerCase();
                let desc = cards[i].innerText.toLowerCase();
                if (name.includes(input) || desc.includes(input)) {
                    cards[i].style.display = "block";
                    visibleCount++;
                } else {
                    cards[i].style.display = "none";
                }
            }

            document.getElementById('noResults').style.display = visibleCount === 0 ? "block" : "none";
        }
    </script>

</body>
</html>
