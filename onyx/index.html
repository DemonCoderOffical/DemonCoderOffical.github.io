<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onyx Programming Language</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            color: #8b949e;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #238636;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.2s;
            display: inline-block;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        .links {
            margin-top: 20px;
        }
        .links a {
            color: #58a6ff;
            text-decoration: none;
            margin: 0 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container"
      
        <img src="onyx.jpeg" alt="Onyx Logo" class="logo">
        
        <h1>Onyx Programming Language</h1>
        <p>A modern, lightweight, and efficient programming language designed for developers.</p>

      
        <a href="onyx.zip" class="btn">Download Onyx (OPM Bundle)</a>
        
        <div class="links">
            <a href="https://github.com/DemonCoderOffical/onyx" target="_blank">GitHub Repository</a>
            <a href="https://github.com/DemonCoderOffical/onyx/issues" target="_blank">Report Bug</a>
        </div>
    </div>

</body>
</html>
